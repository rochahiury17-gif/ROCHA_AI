<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Criar Conta - ROCHA AI</title>

<link rel="stylesheet" href="/V2/css/style.css">

</head>

<body>

<div class="login-container">

    <img src="/V2/assets/logo_v2.png" class="logo">

    <h1>ROCHA AI</h1>

    <p class="subtitle">
        Crie sua conta
    </p>

    <h2>
        Bem-vindo à nova geração
    </h2>

    <input
        id="nome"
        type="text"
        placeholder="Nome"
        autocomplete="name">

    <input
        id="email"
        type="email"
        placeholder="E-mail"
        autocomplete="email">

    <input
        id="senha"
        type="password"
        placeholder="Senha"
        autocomplete="new-password">

    <input
        id="confirmar-senha"
        type="password"
        placeholder="Confirmar senha"
        autocomplete="new-password">

    <button id="criar-conta" class="primary-button">
        Criar conta
    </button>

    <div class="divider">
        ou
    </div>

    <a href="/V2/index.html" class="register-link">
        <button type="button" class="register">
            Já tenho conta
        </button>
    </a>

</div>

<script src="/V2/js/app.js"></script>

</body>

</html>
